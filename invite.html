<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>You're Invited!</title>
    <style>
        body {
            font-family: 'Arial', sans-serif;
            background: #f4f4f9;
            color: #333;
            text-align: center;
            padding: 50px;
        }
        .container {
            background: white;
            max-width: 600px;
            margin: 0 auto;
            padding: 40px;
            border-radius: 10px;
            box-shadow: 0 4px 10px rgba(0,0,0,0.1);
        }
        h1 { color: #ff6b6b; }
        .details { font-size: 1.2em; margin: 20px 0; }
        .btn {
            display: inline-block;
            background: #ff6b6b;
            color: white;
            padding: 12px 25px;
            text-decoration: none;
            border-radius: 5px;
            font-weight: bold;
            margin-top: 20px;
        }
        .btn:hover { background: #ff5252; }
    </style>
</head>
<body>
    <div class="container">
        <h1>You're Invited to Our Celebration!</h1>
        <p class="details">Join us for a wonderful evening of food, music, and great company.</p>
        <p><strong>Date:</strong> Saturday, November 25, 2026</p>
        <p><strong>Location:</strong> The Grand Ballroom, City Center</p>
        
        <!-- Optional RSVP Link -->
        <a href="https://forms.gle/your-google-form-link" class="btn" target="_blank">RSVP Now</a>
    </div>
</body>
</html>
